<body style="font-family:system-ui;background:#1f3a8a;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center">
<p>Esta app se mudó. Te llevamos a la nueva versión…<br><a href="https://script.google.com/a/macros/grupoingeco.com.ar/s/AKfycbzxtWbL6A6xsXqRBx6yGDuSYKWEBebmc68dXlkgGiU5-BesLfal03PsPxZ8sFRDrCo8Cw/exec" style="color:#fff">Si no abre sola, tocá acá</a></p>
<script>
(async function(){
  // Limpiar la PWA vieja (service worker + caché) para que no siga sirviendo la versión anterior.
  try { if ('serviceWorker' in navigator) { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister())); } } catch (e) {}
  try { if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } } catch (e) {}
  location.replace("https://script.google.com/a/macros/grupoingeco.com.ar/s/AKfycbzxtWbL6A6xsXqRBx6yGDuSYKWEBebmc68dXlkgGiU5-BesLfal03PsPxZ8sFRDrCo8Cw/exec" + (location.search || ""));
})();
</script><noscript><meta http-equiv="refresh" content="0; url=https://script.google.com/a/macros/grupoingeco.com.ar/s/AKfycbzxtWbL6A6xsXqRBx6yGDuSYKWEBebmc68dXlkgGiU5-BesLfal03PsPxZ8sFRDrCo8Cw/exec"></noscript></body></html>
